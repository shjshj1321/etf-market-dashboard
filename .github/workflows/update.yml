name: Update market dashboard
on:
  workflow_dispatch:
  schedule:
    # 22:30 UTC Mon-Fri = 07:30 KST Tue-Sat, after US market close
    - cron: '30 22 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update ETF and market data
        run: node scripts/update.js
      - name: Commit fresh data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/signals.json
          if ! git diff --cached --quiet; then
            git commit -m "Update dashboard data"
            git push
          fi
